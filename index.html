<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff7ee;--card:#ffffff;--ink:#2d1b3d;--sub:#7a6684;--a:#ff5d8f;--b:#ffb347;--slot:#ffe8d6}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1226;--card:#2a1c38;--ink:#fff1e6;--sub:#c5b0d3;--slot:#3a2a4b}}
:root[data-theme="dark"]{--bg:#1c1226;--card:#2a1c38;--ink:#fff1e6;--sub:#c5b0d3;--slot:#3a2a4b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;text-align:center;overflow-x:hidden}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
.hero{padding:56px 20px 28px}
.emoji{font-size:64px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
h1{font-size:clamp(34px,8vw,64px);margin:8px 0;line-height:1.1;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.name{font-size:clamp(28px,6vw,44px);font-weight:bold;outline:none;border-bottom:2px dashed var(--a);display:inline-block;min-width:120px;padding:0 8px}
.msg{max-width:560px;margin:20px auto;padding:22px;background:var(--card);border-radius:18px;box-shadow:0 6px 24px rgba(255,93,143,.18);line-height:1.6;font-size:18px;outline:none}
.hint{font:13px system-ui,sans-serif;color:var(--sub);margin:6px}
button{font:600 16px system-ui,sans-serif;border:0;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));padding:12px 26px;border-radius:99px;cursor:pointer;margin:10px 0}
h2{margin:36px 0 14px}

.grid{columns:2 220px;column-gap:16px;max-width:760px;margin:0 auto;padding:0 16px}
figure{break-inside:avoid;margin:0 0 16px;background:#fff;padding:8px 8px 4px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.2);color:#2d1b3d}
figure:nth-child(odd){transform:rotate(-1.5deg)}figure:nth-child(even){transform:rotate(1.5deg)}
figure img{width:100%;display:block;border-radius:3px}
figcaption{font:italic 15px Georgia,serif;padding:8px 2px}
footer{padding:36px 20px 48px;font-size:20px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hero">
  <div class="emoji">🎂</div>
  <h1>Happy Birthday!</h1>
  <div class="name" >Monappa</div>
  <p class="hint">My favourite cousin 💖</p>
  <div class="msg" >Happy Birthday to my favourite cousin! You bring the biggest smiles to every trip and every day. Wishing you cake, laughter and endless fun. Love you loads! 🎉</div>
  <button id="party">🎉 Celebrate!</button>
</div>

<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');let P=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function burst(){const cols=['#ff5d8f','#ffb347','#6ec6ff','#8be28b','#c792ea'];for(let i=0;i<140;i++)P.push({x:Math.random()*cv.width,y:-10,vx:Math.random()*4-2,vy:Math.random()*4+2,s:Math.random()*8+4,c:cols[i%5],r:Math.random()*6});}
(function loop(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});P=P.filter(p=>p.y<cv.height+20);requestAnimationFrame(loop)})();
document.getElementById('party').onclick=burst;burst();
</script>
